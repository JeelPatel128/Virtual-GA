services:
  - type: web
    name: virtual-ga
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GA_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: "gemini-2.5-flash"
      - key: GEMINI_EMBED_MODEL
        value: "gemini-embedding-001"
      - key: TEAMS_WEBHOOK_URL
        sync: false
      - key: LEAD_ALERT_ON_EVERY_HANDOFF
        value: "true"
      - key: GCAL_ICS_URL
        sync: false
      - key: SCHEDULE_CACHE_MINUTES
        value: "5"
      - key: TIMEZONE
        value: "America/New_York"
      - key: ESCALATE_AFTER_MINUTES
        value: "5"
      - key: REMINDER_STEP_MINUTES
        value: "15"
      - key: DIGEST_HOUR
        value: "17"
      - key: PHONE_RETENTION_DAYS
        value: "30"
      - key: MAX_BOT_QUESTIONS_PER_HOUR
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: FRONT_DESK_LOCATION
        value: "the School of Business front desk"
      - key: TEAM_JSON
        sync: false
